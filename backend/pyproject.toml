[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-ai-deterministic-backend"
version = "0.1.0"
description = "소상공인 동적 현금흐름 예측 및 선제적 금융지원 시스템 - 결정론적 백엔드 모듈"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
kb-ai-api = "src.api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"src.registries" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: uses real external provider APIs and credentials",
    "e2e: executes the integrated analysis pipeline",
]
